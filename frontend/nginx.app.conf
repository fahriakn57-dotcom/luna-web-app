server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed bundles (main.<hash>.js etc.) are safe to cache
    # forever — a new deploy always produces a new filename, so there's
    # no staleness risk here.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references the CURRENT bundle hash, so it must never be
    # cached — without this, some browsers/proxies hold onto an old
    # index.html (pointing at an old, since-deleted bundle) well past a
    # normal hard-refresh, making a fresh deploy look like it never landed.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
