server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressed responses (launch audit 2026-10-03: the 634 KB main bundle
    # went out uncompressed — ~190 KB gzipped — slow on phones). The host
    # nginx passes an upstream Content-Encoding straight through.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # The host nginx proxies with HTTP/1.0 by default; nginx only gzips
    # 1.1 requests unless told otherwise.
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Content-hashed bundles (main.<hash>.js etc.) are safe to cache
    # forever — a new deploy always produces a new filename, so there's
    # no staleness risk here.
    # (add_header in a location replaces the server-level ones, so the
    # security headers are repeated in each location.)
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html references the CURRENT bundle hash, so it must never be
    # cached — without this, some browsers/proxies hold onto an old
    # index.html (pointing at an old, since-deleted bundle) well past a
    # normal hard-refresh, making a fresh deploy look like it never landed.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Security headers for the app page (launch audit 2026-10-03):
        # no MIME sniffing, no framing by other sites (clickjacking), no
        # full URLs leaked to other sites, and no camera/location access —
        # the microphone stays allowed for voice calls.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        try_files $uri /index.html;
    }
}
